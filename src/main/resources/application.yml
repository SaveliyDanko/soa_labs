server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/study-groups;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    operations-sorter: alpha
    tags-sorter: alpha

study-groups:
  base-url: ${STUDY_GROUPS_BASE_URL:http://localhost:${server.port}}
