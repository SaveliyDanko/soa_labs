global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client 20s
    timeout server 20s

frontend isu
    bind *:9000
    default_backend isu_instances

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 3s
    hold nx 3s
    hold timeout 3s
    hold refused 3s
    hold other 3s
    hold obsolete 3s

backend isu_instances
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    server isu1 isu-1:8281 check inter 2s fall 2 rise 1 resolvers docker resolve-prefer ipv4 resolve-opts allow-dup-ip init-addr libc,none
    server isu2 isu-2:8282 check inter 2s fall 2 rise 1 resolvers docker resolve-prefer ipv4 resolve-opts allow-dup-ip init-addr libc,none

listen statistics
    bind *:9001
    stats enable
    stats uri /stats
    stats refresh 3s
