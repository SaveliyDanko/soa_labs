events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream zuul {
        zone zuul 64k;
        server api-gateway:8080 resolve;
    }

    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 2m;
        root /usr/share/nginx/html;
        index index.html;
        error_page 502 504 =503 @gateway_unavailable;

        location @gateway_unavailable {
            default_type application/json;
            add_header Content-Language ru always;
            return 503 '{"timestamp":"$time_iso8601","status":503,"code":"UPSTREAM_UNAVAILABLE","message":"Сервис временно недоступен","path":"/"}';
        }

        # Единственный upstream для всех API и документации — Zuul.
        location ~ ^/(api/|isu/|swagger-ui\.html$|openapi\.yaml$|webjars/) {
            proxy_pass http://zuul;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
