apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      volumes:
      - name: schema
        configMap:
          name: postgres-schema
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: study_groups
        - name: POSTGRES_USER
          value: soa
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lab-secrets
              key: db-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: schema
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - soa
            - -d
            - study_groups
          periodSeconds: 3
          failureThreshold: 40
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - soa
            - -d
            - study_groups
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - soa
            - -d
            - study_groups
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
