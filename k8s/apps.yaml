        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env: []
        resources:
          requests:
            cpu: 100m
            memory: 32Mi
          limits:
            cpu: '1'
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
