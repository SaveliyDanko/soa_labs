apiVersion: v1
kind: Service
metadata:
  name: mule-esb
spec:
  selector:
    app.kubernetes.io/name: mule-esb
  ports:
  - name: http
    port: 8081
    targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mule-esb
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mule-esb
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mule-esb
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      containers:
      - name: mule-esb
        image: soa-lab4/mule-esb:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8081
        env:
        - name: SOAP_HOST
          value: isu-service
        - name: SOAP_PORT
          value: '8080'
        - name: GATEWAY_HOST
          value: api-gateway
        - name: GATEWAY_PORT
          value: '8080'
        - name: HTTP_PORT
          value: '8081'
        - name: JAVA_TOOL_OPTIONS
          value: -XX:ActiveProcessorCount=2
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
