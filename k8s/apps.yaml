apiVersion: v1
kind: Service
metadata:
  name: study-groups-service
spec:
  selector:
    app.kubernetes.io/name: study-groups-service
  ports:
  - name: http
    port: 8181
    targetPort: 8181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-groups-service
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: study-groups-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: study-groups-service
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      containers:
      - name: study-groups-service
        image: soa-lab4/study-groups-service:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8181
        env:
        - name: SERVER_PORT
          value: '8181'
        - name: JAVA_TOOL_OPTIONS
          value: -XX:ActiveProcessorCount=2 -Xms64m -Xmx256m
        - name: CONFIG_SERVER_URL
          value: http://config-service:8888
        - name: EUREKA_URL
          value: http://discovery-service:8761/eureka/
        - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
          value: 'true'
        - name: LAB_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: lab-secrets
              key: sentry-dsn
        - name: SENTRY_RELEASE
          value: soa-lab4@4.0.0
        - name: R2DBC_URL
          value: r2dbc:postgresql://postgres:5432/study_groups
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lab-secrets
              key: db-password
        - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
          value: readinessState,r2dbc
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      initContainers:
      - name: wait-for-config
        image: busybox:1.37
        command:
        - sh
        - -c
        - until wget -q -O /dev/null http://config-service:8888/actuator/health; do
          sleep 2; done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: study-groups-service
              topologyKey: kubernetes.io/hostname
---
