apiVersion: v1
kind: Service
metadata:
  name: config-service
spec:
  selector:
    app.kubernetes.io/name: config-service
  ports:
  - name: http
    port: 8888
    targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: config-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-service
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      containers:
      - name: config-service
        image: soa-lab4/config-service:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8888
        env:
        - name: SERVER_PORT
          value: '8888'
        - name: JAVA_TOOL_OPTIONS
          value: -XX:ActiveProcessorCount=2 -Xms64m -Xmx256m
        - name: CONFIG_SERVER_URL
          value: http://config-service:8888
        - name: EUREKA_URL
          value: http://discovery-service:8761/eureka/
        - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
          value: 'true'
        - name: LAB_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: lab-secrets
              key: sentry-dsn
        - name: SENTRY_RELEASE
          value: soa-lab4@4.0.0
        - name: CONFIG_REPO
          value: file:/config-repo
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: configuration
          mountPath: /config-repo
          readOnly: true
      volumes:
      - name: configuration
        configMap:
          name: spring-config
---
