# Optional: requires a default Ingress controller and a TLS Secret named soa-lab4-tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soa-lab4
  namespace: soa-lab4
spec:
  tls:
    - hosts: [soa.local]
      secretName: soa-lab4-tls
  rules:
    - host: soa.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 8080
