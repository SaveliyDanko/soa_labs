server:
  port: 8080
eureka:
  client:
    register-with-eureka: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 3
spring:
  cloud:
    loadbalancer:
      cache:
        enabled: false
      retry:
        enabled: false
    gateway:
      httpclient:
        connect-timeout: 4000
        response-timeout: 15s
      default-filters:
        - RemoveRequestHeader=Cookie
        - RemoveResponseHeader=Set-Cookie
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: study-groups
          uri: lb://study-groups-service
          predicates:
            - Path=/api/study-groups/**,/openapi.yaml,/swagger-ui.html,/webjars/**
        - id: isu
          uri: ${ISU_REST_URL:http://localhost:8281}
          metadata:
            response-timeout: 50000
          predicates:
            - Path=/isu/**
        - id: isu-soap
          uri: ${MULE_ESB_URL:http://localhost:8081}
          metadata:
            response-timeout: 50000
          predicates:
            - Path=/soap/isu
