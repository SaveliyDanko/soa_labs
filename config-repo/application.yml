# Общие настройки выдаются Config Service всем трём приложениям.
lab:
  config-source: spring-cloud-config
  instance-id: ${spring.application.name}:${server.port}
server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
spring:
  cloud:
    config:
      # Порт и идентификатор реплики задаются окружением, остальное — централизованно.
      allow-override: true
      override-system-properties: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:soa-lab3@3.0.0}
  server-name: ${lab.instance-id}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  logging:
    # API errors are reported by ApiExceptionHandler; do not duplicate log events.
    enabled: false
