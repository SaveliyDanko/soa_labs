server:
  port: 8181
spring:
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/study_groups}
    username: ${DB_USER:soa}
    password: ${DB_PASSWORD:soa-lab}
    pool:
      initial-size: 1
      max-size: 5
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 3
  instance:
    instance-id: ${lab.instance-id}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 3
    lease-expiration-duration-in-seconds: 10
